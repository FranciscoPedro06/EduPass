<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Motorista - EduPass</title>
  <style>
    /* 1. Reset e Variáveis de Estilo (PADRÃO GLOBAL) */
    :root {
      --primary-color: #007BFF;
      --primary-dark: #0069D9;
      --primary-tint: rgba(0, 123, 255, 0.08); 
      --primary-tint-border: rgba(0, 123, 255, 0.2);
      
      --bg-color: #F3F4F6;
      --card-color: #FFFFFF;
      --header-bg: var(--primary-color);
      --header-text: var(--card-color);
      --nav-bg: var(--primary-color);
      --nav-text: var(--card-color);
      --nav-inactive: rgba(255, 255, 255, 0.6);

      --primary-text: #111827;
      --secondary-text: #6B7280;
      
      --border-color: #D1D5DB;
      --input-bg: #F9FAFB;
      --list-border: #E5E7EB; 
      
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --info: #3b82f6;

      --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      --card-radius: 24px;
      --button-radius: 12px;
      --item-radius: 16px; 
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--primary-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 100px;
    }

    /* 2. Header Motorista */
    .header {
      background-color: var(--header-bg);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--header-text);
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.2);
      border: 2px solid var(--header-text);
      background-size: cover;
      background-position: center;
    }
    .header-title {
      font-size: 20px;
      font-weight: 700;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-button {
      background: none;
      border: none;
      cursor: pointer;
      position: relative;
      padding: 8px;
      color: var(--header-text);
      border-radius: 50%;
      transition: background-color 0.2s ease;
    }
    .icon-button:hover {
       background-color: rgba(255, 255, 255, 0.1);
    }
    .icon-button svg {
        width: 24px;
        height: 24px;
        display: block;
    }
    .badge {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: var(--card-color);
      color: var(--primary-color);
      font-size: 10px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--primary-color);
    }

    /* 3. Conteúdo Principal */
    .main-content {
      flex: 1;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-y: auto;
    }
    .dashboard-card {
      background-color: var(--card-color);
      border-radius: var(--card-radius);
      padding: 24px;
      max-width: 800px;
      width: 100%;
      box-shadow: var(--card-shadow);
    }

    /* Grid do Menu */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: inherit;
      padding: 8px;
      border-radius: var(--item-radius);
      transition: background-color 0.2s ease;
    }
     .menu-item:hover {
        background-color: var(--bg-color);
     }

    .menu-button {
      width: 80px;
      height: 80px;
      border: 1px solid var(--list-border);
      border-radius: var(--item-radius);
      background-color: var(--primary-tint);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .menu-item:hover .menu-button {
       border-color: var(--primary-tint-border);
       transform: translateY(-2px);
       box-shadow: 0 4px 12px rgba(0, 123, 255, 0.1);
    }
    .menu-item:active .menu-button {
        transform: translateY(0);
        box-shadow: none;
    }
    .menu-button svg {
      width: 36px;
      height: 36px;
      color: var(--primary-color);
    }
    .menu-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--secondary-text);
      text-align: center;
      line-height: 1.4;
    }

    /* 4. Navegação Inferior */
    .bottom-nav {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--nav-bg);
      border-radius: 28px;
      padding: 12px 24px;
      display: flex;
      gap: 24px;
      box-shadow: 0 8px 24px rgba(0, 123, 255, 0.4);
      z-index: 1000;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      color: var(--nav-text);
      cursor: pointer;
      opacity: 1;
      transition: opacity 0.2s ease;
    }
    .nav-item.inactive {
      opacity: 0.6;
    }
     .nav-item:hover:not(.inactive) {
        opacity: 0.8; 
     }

    .nav-icon {
      width: 24px;
      height: 24px;
    }
    .nav-label {
      font-size: 11px;
      font-weight: 500;
    }

    /* Sistema de Alerta */
    #container-alertas {
      position: fixed; top: 20px; right: 20px; z-index: 1001;
      display: flex; flex-direction: column; gap: 10px; max-width: 350px;
    }
    .alerta {
      padding: 15px 20px; color: white; border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-weight: 500;
      animation: slideIn 0.3s ease-out; word-wrap: break-word; line-height: 1.5;
    }
    .alerta-sucesso { background-color: var(--success); }
    .alerta-erro    { background-color: var(--error); }
    .alerta-aviso   { background-color: var(--warning); }
    .alerta-info    { background-color: var(--info); }
    @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(400px); opacity: 0; } }
     .alerta strong { display: block; margin-bottom: 4px; }


    /* Media Queries */
    @media (min-width: 640px) {
        .header { padding: 16px 24px; }
        .avatar { width: 48px; height: 48px; }
        .header-title { font-size: 22px; }
        .main-content { padding: 32px 24px; }
        .dashboard-card { padding: 32px; }
        .menu-grid {
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }
        .menu-button { width: 100px; height: 100px; }
        .menu-button svg { width: 40px; height: 40px; }
        .menu-label { font-size: 14px; }
        .bottom-nav { gap: 32px; padding: 14px 28px; }
        .nav-icon { width: 26px; height: 26px; }
        .nav-label { font-size: 12px; }
    }

    @media (min-width: 1024px) {
        .header-title { font-size: 24px; }
        .dashboard-card { padding: 48px; }
         .menu-grid {
            grid-template-columns: repeat(4, 1fr);
            gap: 32px;
        }
        .menu-button { width: 120px; height: 120px; }
        .menu-button svg { width: 48px; height: 48px; }
        .bottom-nav { gap: 48px; padding: 16px 32px; }
    }

  </style>

  <script>
    // ===== FUNÇÃO DE ALERTA GLOBAL (UNIFICADA) =====
    function mostrarAlerta(mensagem, tipo = 'info') {
      let containerAlertas = document.getElementById('container-alertas');
      if (!containerAlertas) {
        containerAlertas = document.createElement('div');
        containerAlertas.id = 'container-alertas';
        document.body.appendChild(containerAlertas);
      }
      
      let tipoClasse = 'alerta-info';
      switch(tipo) {
        case 'sucesso': tipoClasse = 'alerta-sucesso'; break;
        case 'erro': tipoClasse = 'alerta-erro'; break;
        case 'aviso': tipoClasse = 'alerta-aviso'; break;
      }
      const alerta = document.createElement('div');
      alerta.className = `alerta ${tipoClasse}`;
      alerta.innerHTML = mensagem;
      containerAlertas.appendChild(alerta);
      
      setTimeout(() => {
        alerta.style.animation = 'slideOut 0.3s ease-out';
        setTimeout(() => {
          alerta.remove();
          if (containerAlertas.children.length === 0) {
            containerAlertas.remove();
          }
        }, 300);
      }, 4000); 
    }
  
    // ===== LÓGICA DO DASHBOARD MOTORISTA =====
    document.addEventListener("DOMContentLoaded", () => {
      const notificationsButton = document.getElementById('notificationsButton');
      const logoutButton = document.getElementById('logoutButton');
      
      if (notificationsButton) {
          notificationsButton.addEventListener('click', () => {
              mostrarAlerta('Você tem 2 novas viagens disponíveis.', 'info');
          });
      }
      
      if (logoutButton) {
          logoutButton.addEventListener('click', () => {
              if (confirm('Tem certeza que deseja sair?')) {
                  mostrarAlerta('Saindo...', 'info');
                  sessionStorage.removeItem('usuarioLogado');
                  setTimeout(() => {
                     window.location.assign('index.html');
                  }, 1000); 
              }
          });
      }
    });q
  </script>
