<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motoristas Cadastrados - EduPass</title>
    <link rel="stylesheet" href="./assets/css/listaMoto.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <button class="back-button" onclick="history.back()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
        </button>
        <h1 class="header-title">Motoristas Cadastrados</h1>
    </header>

    <main class="main-content">
        <div id="motoristasLista" class="lista"></div>
    </main>

    <!-- MODAL MOTORISTA -->
<div id="motoristaModal" class="modal hidden">
    <div class="modal-content">
        <button id="closeModal" class="close-btn">&times;</button>

        <div id="modalDetails"></div>

        <button id="deleteMotoristaBtn" class="delete-btn">Excluir Motorista</button>
    </div>
</div>


    <script type="module" src="./assets/js/listaMoto.js"></script>

</body>
</html>
