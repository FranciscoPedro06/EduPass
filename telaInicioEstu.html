<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - EduPass</title>
  <link rel="stylesheet" href="./assets/css/telaInicioEstu.css">
   <style>
    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>
  <div id="container-alertas"></div>

  <div class="header">
    <div class="header-left">
      <h1 class="header-title" id="titulo">EduPass</h1>
    </div>
    <div class="header-right">
      <button class="icon-button" id="notificationsButton" title="Notificações">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span id="notificationBadge" class="notification-badge" hidden></span>
      </button>
      <button class="icon-button" id="logoutButton" title="Sair / Fazer Logout">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="main-content">
    <div class="info-card">
      <div class="photo-container">
        <div class="photo" id="userPhoto"></div>
      </div>
      <div class="info-section">
        <div class="student-name" id="studentName">Carregando...</div>
        <div class="info-row" id="studentInstitution"><span class="info-label">INSTITUIÇÃO:</span> --</div>
        <div class="info-row" id="studentCourse"><span class="info-label">CURSO:</span> --</div>
        <div class="info-row" id="studentShift"><span class="info-label">TURNO:</span> --</div>
        <div class="info-row" id="studentCPF"><span class="info-label">CPF:</span> --</div>
        <div class="status-row">
          <span class="info-label">SITUAÇÃO:</span>
          <span class="status-badge" id="studentStatus">--</span>
        </div>
      </div>
    </div>

    <div class="qr-card">
      <div class="qr-code" id="qrCodePlaceholder">
        Carregando QR Code...
      </div>
    </div>

  </div>

  <div class="bottom-nav">
    <a href="perfilEstu.html" class="nav-item" id="navPerfil">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <div class="nav-label">Perfil</div>
    </a>

    <a href="confirmarEmbarque.html" class="nav-item" id="navChecklist">
      <div class="nav-icon">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
           <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
           <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
           <path d="m9 14 2 2 4-4"></path>
        </svg>
      </div>
      <div class="nav-label">Checklist</div>
    </a>

    <a href="rotas.html" class="nav-item" id="navHorarios">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
        <line x1="8" y1="2" x2="8" y2="18"></line>
        <line x1="16" y1="6" x2="16" y2="22"></line>
      </svg>
      </div>
      <div class="nav-label">Rotas</div>
    </a>

    <a href="centralDuvidas.html" class="nav-item" aria-current="page">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M10 9a2 2 0 1 1 4 0c0 2-3 2-3 4"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </div>
      <div class="nav-label">Ajuda</div>
    </a>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <script type="module" src="./assets/js/telaInicioEstu.js"></script>
</body>
</html>
