<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROTA - Sistema de Gerenciamento</title>
  <link rel="stylesheet" href="./assets/css/rotas.css">
</head>
<body>
  <div class="header">
    <button class="back-button" id="backButton" title="Voltar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <h1 class="header-title">ROTA</h1>
  </div>

  <div class="main-content">
    <!-- Tela 1: Lista de Rotas -->
    <div class="screen" id="screen1">
      <div class="card">
        <div class="period-section">
          <h2 class="period-title">MATUTINO</h2>
          <div class="routes-list">
            <button class="route-btn" data-route="Rota 01" data-period="MATUTINO">
              Rota 01
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
            <button class="route-btn" data-route="Rota 02" data-period="MATUTINO">
              Rota 02
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
            <button class="route-btn" data-route="Rota 03" data-period="MATUTINO">
              Rota 03
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>
        </div>

        <div class="period-section">
          <h2 class="period-title">VESPERTINO</h2>
          <div class="routes-list">
            <button class="route-btn" data-route="Rota 01" data-period="VESPERTINO">
              Rota 01
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
            <button class="route-btn" data-route="Rota 02" data-period="VESPERTINO">
              Rota 02
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>
        </div>

        <div class="period-section">
          <h2 class="period-title">NOTURNO</h2>
          <div class="routes-list">
            <button class="route-btn" data-route="Rota 01" data-period="NOTURNO">
              Rota 01
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
            <button class="route-btn" data-route="Rota 02" data-period="NOTURNO">
              Rota 02
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
            <button class="route-btn" data-route="Rota 03" data-period="NOTURNO">
              Rota 03
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
            <button class="route-btn" data-route="Rota 04" data-period="NOTURNO">
              Rota 04
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tela 2: Selecionar Motorista e Destino -->
    <div class="screen hidden" id="screen2">
      <div class="card">
        <div class="selection-header">
          <h2 id="periodTitle">MATUTINO</h2>
          <p id="routeTitle">Rota 01</p>
        </div>

        <div class="form-group">
          <label class="label" id="selecionarMoto">SELECIONAR MOTORISTA</label>
          <select id="motorista" class="select-input">
            <option value="">Escolha um motorista</option>
          </select>
        </div>
       

        <div class="form-group">
  <label class="label">PERCURSO DA ROTA</label>
  <div id="percursoBox" class="percurso-box">
  </div>
</div>


        <div class="button-group">
          <button class="btn btn-secondary" id="voltar1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M19 12H5M12 19l-7-7 7-7"></path>
            </svg>
          </button>
          <button class="btn btn-primary" id="confirmar">CONFIRMAR ROTA</button>
        </div>
      </div>
    </div>

    <!-- Tela 3: Confirmação -->
    <div class="screen hidden" id="screen3">
      <div class="card">
        <div class="confirmation">
          <div class="confirmation-item">
            <span class="label">MOTORISTA</span>
            <p id="confirmMotorista">-</p>
          </div>

          <div class="confirmation-item">
            <span class="label">DESTINO</span>
            <p id="confirmDestino">-</p>
          </div>

          <div class="success-message">
            <p>ROTA CONFIRMADA!</p>
          </div>

          <button class="btn btn-secondary full-width" id="alterar">ALTERAR ROTA</button>
        </div>
      </div>
    </div>
  </div>

  <div id="alertas-container"></div>

  <script type="module" src="./assets/js/rotas.js"></script>
</body>
</html>
